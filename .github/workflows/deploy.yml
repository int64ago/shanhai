name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy (shanhaiworld.org)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate assets & build production bundle
        run: |
          pnpm validate
          pnpm build

      - name: Upload production dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: shanhaiworld-dist
          path: dist
          retention-days: 7

      - name: Deploy to Cloudflare (shanhaiworld.org)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4 deploy

      - name: Notice when Cloudflare secrets are not configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          {
            echo "### Cloudflare Deployment Pending Secrets"
            echo "Production bundle \`dist/\` built and validated successfully."
            echo ""
            echo "To enable live deployment to **https://shanhaiworld.org/**, add these two Repository Secrets under **Settings → Secrets and variables → Actions**:"
            echo "- \`CLOUDFLARE_API_TOKEN\` (Workers Scripts: Edit, Workers Routes: Edit)"
            echo "- \`CLOUDFLARE_ACCOUNT_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
